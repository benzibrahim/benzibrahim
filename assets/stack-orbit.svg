<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Technology orbit</title>
  <desc>Animated orbits around a product hub, with React Native, Expo, TypeScript, Python, and Django.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1424"/>
      <stop offset="0.52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#1C1030"/>
    </linearGradient>
    <linearGradient id="ring" x1="210" y1="0" x2="990" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#67E8F9" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.1"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#dots)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" stroke="url(#ring)" stroke-opacity="0.34" stroke-width="2"/>

  <text x="58" y="55" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.7">MY TOOLBOX / IN MOTION</text>
  <text x="1140" y="55" text-anchor="end" fill="#8494AD" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.4">MOBILE + WEB + SYSTEMS</text>

  <ellipse cx="600" cy="222" rx="415" ry="142" stroke="url(#ring)" stroke-opacity="0.23" stroke-width="2"/>
  <ellipse cx="600" cy="222" rx="292" ry="99" stroke="url(#ring)" stroke-opacity="0.32" stroke-width="2"/>
  <ellipse cx="600" cy="222" rx="190" ry="61" stroke="#67E8F9" stroke-opacity="0.14" stroke-width="2"/>
  <circle cx="600" cy="222" r="128" fill="url(#glow)"/>

  <circle r="18" fill="#67E8F9" opacity="0.45" filter="url(#blur)">
    <animateMotion dur="10s" repeatCount="indefinite" path="M185 222 A415 142 0 1 0 1015 222 A415 142 0 1 0 185 222"/>
  </circle>
  <circle r="7" fill="#67E8F9">
    <animateMotion dur="10s" repeatCount="indefinite" path="M185 222 A415 142 0 1 0 1015 222 A415 142 0 1 0 185 222"/>
  </circle>
  <circle r="6" fill="#C084FC">
    <animateMotion dur="7s" repeatCount="indefinite" path="M892 222 A292 99 0 1 0 308 222 A292 99 0 1 0 892 222"/>
  </circle>
  <circle r="4" fill="#F8FAFC">
    <animateMotion dur="5s" repeatCount="indefinite" path="M410 222 A190 61 0 1 0 790 222 A190 61 0 1 0 410 222"/>
  </circle>

  <rect x="452" y="176" width="296" height="92" rx="24" fill="#101D30" stroke="#67E8F9" stroke-opacity="0.52" stroke-width="2"/>
  <text x="600" y="210" text-anchor="middle" fill="#67E8F9" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.7">THE CENTER</text>
  <text x="600" y="241" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800">IDEA → PRODUCT</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1">
    <rect x="88" y="119" width="174" height="43" rx="13" fill="#10253A" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="175" y="146" text-anchor="middle" fill="#CFFAFE">REACT NATIVE</text>
    <rect x="892" y="106" width="181" height="43" rx="13" fill="#24183C" stroke="#C084FC" stroke-opacity="0.55"/>
    <text x="982" y="133" text-anchor="middle" fill="#F3E8FF">TYPESCRIPT</text>
    <rect x="84" y="283" width="127" height="43" rx="13" fill="#14233B" stroke="#818CF8" stroke-opacity="0.55"/>
    <text x="147" y="310" text-anchor="middle" fill="#E0E7FF">DJANGO</text>
    <rect x="988" y="289" width="118" height="43" rx="13" fill="#10253A" stroke="#22D3EE" stroke-opacity="0.55"/>
    <text x="1047" y="316" text-anchor="middle" fill="#CFFAFE">EXPO</text>
    <rect x="518" y="345" width="164" height="43" rx="13" fill="#24183C" stroke="#C084FC" stroke-opacity="0.55"/>
    <text x="600" y="372" text-anchor="middle" fill="#F3E8FF">PYTHON</text>
  </g>
</svg>
